<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        {% block title %}
        Finance
        {% endblock %}
    </title>


    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">

</head>


<body>


<div class="app">


    <!-- =====================
         SIDEBAR
    ====================== -->


    <aside class="sidebar">


        <div class="logo">

            💰

            <span>
                Finance 
            </span>

        </div>



        <nav>


            <a href="/home">

                🏠

                <span>
                    Главная
                </span>

            </a>



            <a href="/transactions-page">

                💳

                <span>
                    Операции
                </span>

            </a>



            <a href="/transactions/add">

                ➕

                <span>
                    Добавить
                </span>

            </a>



            <a href="/calendar">

                📅

                <span>
                    Календарь
                </span>

            </a>



            <a href="/forecast-page">

                📊

                <span>
                    Прогноз
                </span>

            </a>



            <a href="/notifications-page">

                🔔

                <span>
                    Уведомления
                </span>

            </a>



            <a href="/recurring-page">

                🔄

                <span>
                    Подписки
                </span>

            </a>


        </nav>



        <div class="sidebar-footer">


            <p>
                Finance 
            </p>


            <small>
                v1.0
            </small>


        </div>


    </aside>





    <!-- =====================
         MAIN
    ====================== -->


    <main class="main">


        <header class="topbar">


            <div>

                <h2>
                    Панель управления
                </h2>

                <p>
                    Автоматизированный учет финансов
                </p>


            </div>



            <div class="profile">

                👤

                Администратор

            </div>


        </header>





        <section class="page">


            {% block content %}

            {% endblock %}


        </section>


    </main>



</div>


</body>

</html>
