<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Finance Max Alice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f5f6fa;
        }

        .login-container {
            width: 400px;
            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;

            font-size: 28px;
            font-weight: 700;

            color: #222;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #444;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #222;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;

            border-radius: 10px;

            background: #ffe5e5;
            color: #c62828;

            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        Finance Max Alice
    </div>

    <div class="subtitle">
        Вход для директора
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/login">

        <div class="form-group">
            <label for="username">
                Логин
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Введите логин"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Введите пароль"
                required
            >
        </div>

        <button type="submit">
            Войти
        </button>

    </form>

</div>

</body>
</html>
